kids = ["for kids", "nursery", "kids songs", "cocomelon", "toddler"]
# + 11.10: живой прогон поднял «female psychology» с роликом «Why Men Love Kissing Down There» на 1-е место
adult_bait = ["sexy", "bikini", "onlyfans", "thirst trap", "intimacy", "seduction", "seduce", "sexual",
              "down there", "kissing", "turn her on", "aroused", "lust"]
