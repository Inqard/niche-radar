# Niche Radar — конфигурация. Пороги и веса — стартовые гипотезы (см. docs/RADAR-SPEC.md),
# калибруются по данным. Источник каждого правила указан в комментарии.

[search]
region = "US"
language = "en"
# Порядок выдачи чередуется при каждом повторе запроса: viewCount показывает крупные каналы,
# relevance — другой срез (11.10: один viewCount давал наклон к уже большим каналам)
orders = ["viewCount", "relevance"]
window_days = 30              # В1: «сок» — последние 2 недели; берём 30, чтобы видеть и серийность
durations = ["medium", "long"] # medium = 4–20 мин, long = >20 мин (Shorts не ищем)
pages_per_query = 1           # 1 страница = 50 видео = 1 вызов search.list
max_calls_per_run = 80        # лимит search.list — 100 вызовов/сутки, оставляем запас
daily_search_limit = 100

[retention]
# YouTube API Services Developer Policies III.E.4: публичную статистику (Non-Authorized Data) нельзя
# хранить дольше 30 дней — снимки старше удаляются, видео/каналы без обновления за 30 дней удаляются.
# Хранение дольше (для расчёта роста за квартал) — только после одобрения по разделу III.L (заявка).
days = 30

[schedule]
requery_days = 4              # запросы интересов ([directions]) — раз в N дней
explore_requery_days = 10     # запросы широкой карты ([explore_directions]) — реже, их много
explore_durations = ["medium"] # широкая карта: только 4–20 мин (основной формат безликих каналов)
explore_share = 0.4           # доля бюджета поиска на новые (автонайденные) подниши
refresh_window_days = 30      # статистику найденных видео обновляем ежедневно (дёшево) столько дней (= retention)

[discovery]
min_channels = 2              # фраза-подниша должна встречаться у ≥ 2 разных каналов
min_views = 30000             # учитываем видео-источники от стольких просмотров
max_new_per_run = 15          # сколько новых кандидатов добавлять за запуск
# Разнообразие (живой прогон 11.10: ESL дал 11 из 15 кандидатов — самоусиление одной темы):
max_new_per_direction = 4     # не больше N новых кандидатов одного направления за запуск
max_source_risk_share = 0.25  # кластеры с долей рисковых видео выше — не источник новых запросов
min_words = 2
max_words = 4
dormant_after_runs = 3        # подниша с низким score столько запусков подряд → dormant
dormant_score = 3.0
# Слова, которые не образуют подниш сами по себе
stopwords = [
  "the", "a", "an", "and", "or", "of", "to", "in", "on", "for", "with", "is", "are", "was", "were",
  "how", "why", "what", "when", "who", "this", "that", "these", "those", "you", "your", "my", "i",
  "it", "its", "we", "they", "their", "be", "can", "will", "just", "about", "from", "by", "at", "as",
  "video", "videos", "youtube", "new", "best", "top", "full", "official", "ever", "most", "vs",
  "shorts", "part", "episode", "ep", "no", "not", "do", "does", "did", "has", "have", "had",
  # + 11.10: живой прогон дал кандидата «then he»
  "then", "he", "she", "him", "her", "his", "hers", "them", "us", "our", "me", "if", "so", "but",
  "than", "there", "after", "before", "out", "up", "down", "into", "over", "all", "more", "much",
  "very", "even", "still", "too", "s", "t", "re", "ll", "ve", "d", "m",
  # + 11.10 второй срез: кластеры «get», «doing», «here's»
  "get", "gets", "got", "getting", "doing", "going", "went", "come", "came", "take", "took", "see",
  "here's", "that's", "it's", "what's", "there's", "don't", "can't", "won't", "didn't", "isn't", "i'm",
  "you're", "we're", "they're", "let's", "who's", "how's",
]

# Кликбейт и общие слова: фраза только из них подниши не образует ('never knew', 'crazy facts'),
# а запрос-кандидат не может с них начинаться ('complete game', 'weird origin' — модификатор, а не тема).
# Слова, которые бывают частью настоящих тем (world war, medieval times, first world war), сюда не входят.
generic_words = [
  "never", "knew", "know", "need", "actually", "really", "insane", "crazy", "secret", "secrets",
  "truth", "shocking", "explained", "things", "thing", "everything", "nobody", "story", "stories",
  "facts", "minutes", "hours", "biggest", "worst", "weird", "strange", "real", "behind", "here",
  "made", "make", "ultimate", "complete", "guide", "way", "ways", "should", "would", "could", "every",
  "one", "only",
]
# С этих слов поисковый запрос начинаться не может ('complete game', 'actually works'). Жанровые слова
# 'weird', 'secret', 'dark', 'strange', 'real', 'lost' сюда НЕ входят: 'weird animals', 'secret societies' —
# настоящие подниши (11.10: прежнее правило блокировало их).
query_head_blocklist = [
  "never", "knew", "know", "need", "actually", "really", "insane", "crazy", "shocking", "nobody",
  "things", "thing", "everything", "minutes", "hours", "here", "made", "make", "should", "would", "could",
  "every", "one", "only", "ultimate", "complete", "explained", "guide", "best", "top", "new", "most",
  "biggest", "worst", "finally", "simply",
]

[related]                     # похожие каналы: рекомендованные + публичные подписки (docs/RADAR-SPEC.md, v2)
# Граф каналов — главный рычаг широты без поисковой квоты (2 ед. на канал из 10 000/сутки)
max_seed_channels = 80        # от скольких каналов (индикаторы, выбросы) расширяемся за запуск
max_new_channels = 150        # сколько новых похожих каналов обогащать за запуск
use_subscriptions = true

[clusters]                    # подниши по смыслу (v2)
join_similarity = 0.25        # косинус TF-IDF для присоединения видео к кластеру
merge_similarity = 0.5        # слияние кластеров с близкими центрами
max_df_share = 0.2            # термин у > 20% видео окна — слишком общий
centroid_terms = 40
min_videos = 3
min_channels = 2
max_title_ngram = 2

[claude]                      # контур Claude без платного API (v2)
export_clusters = 40
import_priority = 10.0        # приоритет запросов, предложенных Claude (выше автонайденных)

[charts]
# videos.list chart=mostPopular для США: 1=Film&Animation 2=Autos 15=Pets&Animals 20=Gaming
# 24=Entertainment 26=Howto&Style 28=Science&Technology 22=People&Blogs 23=Comedy 25=News&Politics
# 17=Sports 10=Music. Проверено 11.10.2026: 27=Education и 19=Travel для US отдают 404, 29 даёт 2 видео.
# Все рабочие категории — чтобы видеть ниши за пределами интересов без наклона; стоимость 1 ед. каждая.
category_ids = ["28", "20", "15", "2", "1", "24", "26", "22", "23", "25", "17", "10"]
# Тренды всей англоязычной аудитории, не только США (1 ед. на категорию × регион)
regions = ["US", "GB", "CA", "AU"]

[category_search]
# В2: Viewstats «Top Videos → Long → страна + категория → за последний месяц» — топ категории БЕЗ ключевого
# слова: search.list + videoCategoryId, US, окно [search].window_days, order=viewCount. Видит то, что не
# поймали ни ключи, ни тренды, — в т.ч. Education (27) и Travel (19), которых нет в mostPopular для US.
# Все 15 назначаемых категорий: 1 Film&Animation, 2 Autos, 10 Music, 15 Pets&Animals, 17 Sports,
# 19 Travel&Events, 20 Gaming, 22 People&Blogs, 23 Comedy, 24 Entertainment, 25 News&Politics,
# 26 Howto&Style, 27 Education, 28 Science&Tech, 29 Nonprofits. 1 вызов search на категорию × длительность.
category_ids = ["27", "28", "24", "22", "1", "2", "10", "15", "17", "19", "20", "23", "25", "26", "29"]
durations = ["medium", "long"]
requery_days = 14             # 30 вызовов за круг ≈ 2/сутки на квоте по умолчанию; после расширения квоты → 1–3

[enrich]
max_subs = 500000             # каналы крупнее — уже не «окно возможностей», загрузки не тянем
min_hit_views = 20000         # канал-кандидат должен иметь видео в окне с ≥ стольких просмотров
max_channels = 400            # 2 ед. квоты на канал (playlistItems + videos)

[metrics]
long_min_seconds = 240        # длинное видео = от 4 мин (как videoDuration=medium у API)
fresh_days = 14               # В1: «последние 2 недели — сок»; импульс = свежие/сутки ÷ старые/сутки
hype_min_fresh_views = 200000 # в рейтинг «хайп сейчас» попадают подниши с ≥ стольких просмотров за 14 дн
momentum_floor_views_per_day = 5000 # нижняя планка «старой» скорости: тема без старых видео = новая, не ∞
one_hit_share = 0.7           # В4: > 70% просмотров группы у одного ролика — прострел, а не ниша (раздел 2b)
min_video_age_days = 3        # свежайшие видео не учитываем в метриках канала
seriality_fraction = 0.25     # «хит» = ≥ 25% лучшего видео канала
one_hit_top2_share = 0.7      # В4: канал держится на 1–2 идеях
one_hit_min_videos = 5
template_min_titles = 5
demonet_max_median_interval_days = 7
demonet_min_gap_days = 14     # В1: «часто выкладывал — и 2 недели тишина»
demonet_gap_multiplier = 3
farm_max_interval_days = 0.5  # В1: «часовые ролики по 2–3 в день — контент-ферма» → медианный интервал ≤ 12 ч
farm_min_videos = 5
rate_target_days = 7          # vidIQ «за 7 дней»: прирост канала берём по снимку, ближайшему к 7 дням назад
rate_min_days = 0.8           # короче — не скорость, а шум округления
evergreen_min_age_days = 30   # «старые» видео = старше окна; их доля в суточных просмотрах канала = вечнозелёность

[outlier]
min_views = 50000
min_views_per_sub = 3.0

[indicator]                   # канал-индикатор (В1 + В2)
max_age_days = 120            # В2: ≤ 2 мес.; расширено
min_videos = 3
max_videos = 60               # В2: 10–50
max_subs = 100000             # В1: каналы до 100K
min_best_views = 100000
min_growth_ratio = 5.0
# 11.10 аудит: порог 100K отсекал 403 из 497 молодых каналов — наклон к массовым нишам (ESL, развлечения).
# Третий путь для узких ниш: хит ≥ 30K при просмотрах ≥ 10× подписчиков (В1: «мало подписчиков, большие просмотры»)
relative_min_best_views = 30000
relative_min_views_per_sub = 10.0

[niche]
established_min_subs = 100000
established_min_age_days = 365
# 11.10 аудит: без этого 691 «закрепившийся конкурент» имел < 20K подписчиков (медиана 9.5K) —
# канал-старожил без аудитории не конкурент (В1: «закрепившиеся» = давно забирают трафик)
established_aged_min_subs = 20000
# RPM по категории — только справочная колонка «RPM-ориентир», в рейтинг не входит (оператор 11.10:
# «деньги приходят за просмотры; можно меньше за 1000, но больше просмотров»).
max_established = 6           # В1: > 5–6 закрепившихся = переполнено
newcomer_weight = 0.5
newcomer_cap = 5
# Флаги риска считаются и показываются (доля видео), но в рейтинг НЕ входят (оператор 11.10:
# «отбираем топ по просмотрам, решение за мной»). Также: рисковые видео не порождают новые запросы.
scored_risk_flags = ["medical", "politics", "kids", "adult_bait", "animal_rescue", "made_for_kids"]
english_only = true

# Медианы RPM AIR Media-Tech 2026 (research/03 §2), сопоставленные с категориями YouTube грубо.
# Справочно (колонка «RPM-ориентир»); категорию ставит сам автор, поэтому в рейтинг не входит.
# 28 Science&Technology → Gadgets&Tech (консервативно: научные объяснения могут быть ближе к Education).
[rpm_by_category]
"1" = 2.43   # Film & Animation → Entertainment
"2" = 5.69   # Autos & Vehicles → Transport (мало каналов в выборке)
"10" = 2.28  # Music
"15" = 2.30  # Pets & Animals → нет в AIR, медиана всех ниш
"17" = 1.23  # Sports → Health & Sport
"19" = 2.98  # Travel & Events → Lifestyle
"20" = 2.05  # Gaming
"22" = 2.43  # People & Blogs → Entertainment
"23" = 2.43  # Comedy → Entertainment
"24" = 2.43  # Entertainment
"25" = 2.60  # News & Politics
"26" = 2.98  # Howto & Style → Lifestyle
"27" = 10.22 # Education → Education & Science
"28" = 2.33  # Science & Technology → Gadgets & Tech
"default" = 2.30

