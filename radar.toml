# Рынок США: видео для других рынков не участвуют в оценке ниш, индикаторах, выбросах, автопоиске
# и похожих каналах. Введено после первого живого прогона 11.10.2026: 27% видео окна — не английские
# (фильтруются по audio_lang), но часть помечена авторами как 'en' ошибочно: индийские экзаменационные
# билеты («12th Physics Quarterly Question Paper 2026», «2nd PUC…»), названия на малаялам/хинди.
[market]
exclude_non_latin_titles = true   # буквы не латиницей в названии при audio_lang=en → другой рынок
exclude_keywords = [
  "question paper", "quarterly exam", "half yearly", "board exam", "cbse", "ncert", "icse", "puc",
  "upsc", "ssc", "neet", "jee", "tnpsc", "class 5", "class 6", "class 7", "class 8", "class 9",
  "class 10", "class 11", "class 12", "in hindi", "in urdu", "in tamil", "in telugu", "in bangla",
  "hindi", "urdu", "tamil", "telugu", "malayalam", "kannada", "bangla", "marathi", "gujarati", "punjabi",
  # + 11.10 второй прогон: кенийские/западноафриканские экзамены
  "knec", "kcse", "kpsea", "waec", "jamb", "neco",
  # + 11.10: хинглиш латиницей («kaise banaye» = «как сделать») проходил как английский
  "kaise", "kya", "kyun", "kyu", "hai", "hain", "nahi", "wala", "wale", "bhai", "sabse", "kaun", "aur",
  "banaye", "karo", "karne", "tarika", "jankari", "hindi mein", "urdu mein",
]

# Флаги риска (research/03 §4). Совпадение по целому слову/фразе, без учёта регистра.
[risk_keywords]
# 11.10 аудит: bare "doctor" ловил Doctor Strange / Doctor Who / игровой лор → только медицинские обороты
medical = ["doctor explains", "doctor reveals", "doctors warn", "doctors don't", "doctors won't", "your doctor",
           "symptoms", "cure", "cancer", "diabetes", "blood pressure", "remedy", "remedies", "supplement",
           "weight loss", "urologist", "cardiologist"]
